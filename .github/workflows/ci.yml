name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      MONGO_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results

  # The production image must build, start as non-root, and answer /health.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mainstreet:ci .
      - run: docker run -d --name app -p 3000:3000 -e LLM_PROVIDER=none mainstreet:ci
      - run: |
          for i in $(seq 1 30); do curl -fsS localhost:3000/health && exit 0; sleep 1; done
          docker logs app; exit 1
      - run: test "$(docker exec app whoami)" = node

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Economy profile (CloudFront + one EC2 instance). Turn on with the repository variables
  # DEPLOY=economy and INSTANCE_ID, and the secret AWS_DEPLOY_ROLE_ARN (all printed by
  # `npx cdk deploy`). Infrastructure changes are deployed by hand; this ships the app.
  deploy-economy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY == 'economy'
    needs: [test, e2e, image, infra]
    runs-on: ubuntu-latest
    concurrency: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the image (tagged with the commit)
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/mainstreet
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push --all-tags $IMAGE
      - name: Restart the app on the instance with the new image
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "${{ vars.INSTANCE_ID }}" --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" --parameters 'commands=["/opt/mainstreet/run.sh ${{ github.sha }}"]' \
            --query Command.CommandId --output text)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" --query '[StandardOutputContent,StandardErrorContent]' --output text
          test "$STATUS" = Success
      - name: Smoke test the live site
        run: |
          DOMAIN=$(node -p "require('./infra/cdk.json').context.domainName")
          for i in $(seq 1 20); do curl -fsS "https://$DOMAIN/health" && break; sleep 6; done
          curl -fsS "https://$DOMAIN/api/platform" | grep -q '"demo":{'
          # the origin refuses anyone who skips CloudFront
          test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://origin.$DOMAIN/api/platform" || true)" != 200

  # Full profile (load balancer + Fargate): DEPLOY=full. Runs cdk deploy from CI.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && (vars.DEPLOY == 'full' || vars.DEPLOY == 'true')
    needs: [test, e2e, image, infra]
    runs-on: ubuntu-latest
    concurrency: production
    permissions:
      id-token: write # lets the job get an AWS role over OIDC; no AWS keys are stored in GitHub
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: npx cdk deploy -c profile=full --require-approval never
      - name: Smoke test the live site
        run: |
          DOMAIN=$(node -p "require('./cdk.json').context.domainName")
          for i in $(seq 1 20); do curl -fsS "https://$DOMAIN/health" && exit 0; sleep 6; done
          exit 1
