services:
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  # A fake inbox: every email the app sends lands at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  # The production image, run locally:  docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    ports: ["3000:3000"]
    environment:
      MONGO_URL: mongodb://mongo:27017/mainstreet
      BASE_DOMAIN: lvh.me
      PUBLIC_URL: http://localhost:3000
      LLM_PROVIDER: ollama
      OLLAMA_URL: http://host.docker.internal:11434   # Ollama on your machine, reached from the container
      SMTP_URL: smtp://mailpit:1025
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
